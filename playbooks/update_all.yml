---
- hosts: all, !dev
  become: yes
  gather_facts: yes
  serial: 1

  tasks:
    - name: update and reboot
      block:
        - name: update all packages
          ansible.builtin.dnf:
            name: '*'
            state: latest
          notify: reboot vm

  handlers:
    - name: reboot vm
      ansible.builtin.reboot:
        reboot_timeout: 600
